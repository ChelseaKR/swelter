name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thursdays at 07:23 UTC; off-the-hour and separated from other security scans.
    - cron: "23 7 * * 4"
  workflow_dispatch:

# Scorecard's producer job receives only the permissions required for analysis and SARIF upload.
permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref. The key carries the event as
# well as the ref, because a bare `${{ github.ref }}` on a busy `main` makes consecutive pushes
# supersede each other: the older commit's run is cancelled before a job is dispatched, so that
# commit never gets a verdict and the branch looks green on the strength of a run that never
# happened. Pull-request runs share one slot per ref and do supersede each other, which is the
# saving this is for; every push keeps its own slot, keyed by the commit it is a verdict about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Preserve the Scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload Scorecard SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
