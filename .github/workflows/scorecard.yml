name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thursdays at 07:23 UTC; off-the-hour and separated from other security scans.
    - cron: "23 7 * * 4"
  workflow_dispatch:

# Scorecard's producer job receives only the permissions required for analysis and SARIF upload.
permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze supply-chain posture
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Preserve the Scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload Scorecard SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
