# Publish the dashboard to GitHub Pages as a live demo, populated with REAL open data: current
# hourly air quality (Copernicus CAMS) and weather for Sacramento neighborhoods, via Open-Meteo
# (no API key). The dashboard is static, so the fetched surface is baked into the artifact along
# with a DATA-LICENSE and a CSV download. Runs on push and daily so the readings stay current; if
# the fetch ever fails it falls back to the committed synthetic demo so the page never breaks.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"  # refresh the real readings daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Assemble the live demo (real open data, synthetic fallback)
        run: |
          uv run swelter fetch --store /tmp/real --config /tmp/real-network.yaml --web web --past-days 3 \
            || uv run swelter demo --store /tmp/real --web web
          cp DATA-LICENSE web/DATA-LICENSE
          uv run swelter export --store /tmp/real --format csv > web/export.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
