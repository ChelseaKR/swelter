# Publish the dashboard to GitHub Pages as a live demo with REAL open data on two pages:
#   "/"         — California. Dense REAL physical sensors (OpenAQ, block-by-block) when the
#                 OPENAQ_API_KEY repo secret is set; otherwise Copernicus CAMS model data (keyless).
#   "/sensors/" — real community low-cost sensors from Sensor.Community (Stuttgart, keyless)
# The dashboard is static, so each fetched surface is baked into the artifact with a DATA-LICENSE and
# a CSV download. Runs on push and daily so the readings stay current; page 1 falls back
# (OpenAQ → CAMS → committed synthetic demo) and sensors → the CAMS surface, so the page never breaks.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"  # refresh the real readings daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: Assemble the live demo (real sources, layered fallback)
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          # Page 1 ("/"): prefer dense REAL physical sensors across California (OpenAQ, block-by-block
          # — needs the OPENAQ_API_KEY repo secret); else Copernicus CAMS model (keyless, coarse);
          # else the committed synthetic demo. web/basemap.geojson draws the California outlines.
          uv run swelter fetch --source openaq --store /tmp/cams --config /tmp/cams.yaml \
              --web web --max-locations 250 \
            || uv run swelter fetch --source openmeteo --store /tmp/cams --config /tmp/cams.yaml \
              --web web --past-days 1 \
            || uv run swelter demo --store /tmp/cams --web web
          cp DATA-LICENSE web/DATA-LICENSE
          uv run swelter export --store /tmp/cams --format csv > web/export.csv
          # Page 2 ("/sensors/"): real community low-cost sensors (Sensor.Community, Stuttgart).
          rm -rf web/sensors && mkdir -p web/sensors
          find web -maxdepth 1 -type f -exec cp {} web/sensors/ \;
          cp -r web/i18n web/sensors/i18n
          rm -f web/sensors/basemap.geojson  # Stuttgart is not California — keep its map schematic
          uv run swelter fetch --source sensor-community --store /tmp/sc --config /tmp/sc.yaml \
            --web web/sensors || cp web/sample-surface.json web/sensors/sample-surface.json
          cp DATA-LICENSE web/sensors/DATA-LICENSE
          uv run swelter export --store /tmp/sc --format csv > web/sensors/export.csv \
            || cp web/export.csv web/sensors/export.csv
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4