# Publish the dashboard to GitHub Pages as a live demo. The dashboard is static and falls back
# to the committed sample-surface.json when there is no API, so Pages serves a fully working
# demo (map/table/list, AQI + health context, search, °F, English/Spanish) at no cost. This job
# also bakes a real DATA-LICENSE and a demo export.csv into the artifact so the footer's links
# resolve on a static host (under `swelter serve` those are dynamic routes instead).
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Assemble the static demo site
        run: |
          uv run swelter demo --store /tmp/demo-store --web web
          cp DATA-LICENSE web/DATA-LICENSE
          # A bounded slice (the demo week's last day) keeps the download small at any network size.
          uv run swelter export --store /tmp/demo-store --format csv --since 2026-06-07 > web/export.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
