# Scheduled full-history secret scan (SEC-19). The `security` job in ci.yml already runs
# gitleaks on every push/PR against the *diff*; this complements it with a weekly sweep of the
# *entire* git history using a different engine (verified-credential checking against live
# provider APIs), catching a secret that predates this gate or that gitleaks' ruleset misses.
name: TruffleHog (scheduled full-history scan)

on:
  schedule:
    # Wednesdays at 09:41 UTC. Off-the-hour, and offset from CodeQL's Monday cron.
    - cron: "41 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog (full history, verified and unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history -- this scan's whole point is not being diff-scoped
          persist-credentials: false

      # Verified findings are confirmed active. Unknown findings could not be checked against a
      # provider and must also fail closed; otherwise an API outage would silently weaken the gate.
      # No `base`/`head` is given, so this scans the full repository (not just a commit range).
      - name: TruffleHog (full history)
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --object-discovery --results=verified,unknown --fail
