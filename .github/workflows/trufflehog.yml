# Scheduled full-history secret scan (SEC-19). The `security` job in ci.yml already runs
# gitleaks on every push/PR against the *diff*; this complements it with a weekly sweep of the
# *entire* git history using a different engine (verified-credential checking against live
# provider APIs), catching a secret that predates this gate or that gitleaks' ruleset misses.
name: TruffleHog (scheduled full-history scan)

on:
  schedule:
    # Wednesdays at 09:41 UTC. Off-the-hour, and offset from CodeQL's Monday cron.
    - cron: "41 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog (full history, verified and unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history -- this scan's whole point is not being diff-scoped
          persist-credentials: false

      # Verified findings are confirmed active. Unknown findings could not be checked against a
      # provider and must also fail closed; otherwise an API outage would silently weaken the gate.
      #
      # `path` is what makes this a whole-repository scan. Omitting `base`/`head` does NOT fall
      # back to scanning everything, which is what the note here used to claim: with all three
      # unset the action resolves base and head to the same commit and exits 1 on its own guard,
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything." Every scheduled run
      # since this workflow was added failed that way, reporting failure while covering zero
      # commits, which is the worst state for a gate to be in: loud and empty.
      #
      # `--fail` is not passed here. The action's baked-in command already includes it, and
      # repeating it is a CLI error ("flag 'fail' cannot be repeated"), so this would have failed
      # a second time on the first run that got past the guard above.
      - name: TruffleHog (full history)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --object-discovery --results=verified,unknown
