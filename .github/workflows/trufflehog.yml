# Scheduled full-history secret scan (SEC-19). The `security` job in ci.yml already runs
# gitleaks on every push/PR against the *diff*; this complements it with a weekly sweep of the
# *entire* git history using a different engine (verified-credential checking against live
# provider APIs), catching a secret that predates this gate or that gitleaks' ruleset misses.
name: TruffleHog (scheduled full-history scan)

on:
  schedule:
    # Wednesdays at 09:41 UTC. Off-the-hour, and offset from CodeQL's Monday cron.
    - cron: "41 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog (full history, verified and unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history -- this scan's whole point is not being diff-scoped
          persist-credentials: false

      # Verified findings are confirmed active. Unknown findings could not be checked against a
      # provider and must also fail closed; otherwise an API outage would silently weaken the gate.
      #
      # `path` is what makes this a whole-repository scan. Omitting `base`/`head` does NOT fall
      # back to scanning everything, which is what the note here used to claim: with all three
      # unset the action resolves base and head to the same commit and exits 1 on its own guard,
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything." Every scheduled run
      # since this workflow was added failed that way, reporting failure while covering zero
      # commits, which is the worst state for a gate to be in: loud and empty.
      #
      # `--fail` and `--no-update` are not passed here. The action's baked-in command already
      # includes both, and repeating a flag is a hard CLI error ("flag 'fail' cannot be
      # repeated"), so this would have failed a second time on the first run to get past the
      # guard above.
      #
      # `--object-discovery` is gone because it was never a flag. It is a separate sub-command
      # ("sub-module to run: object-discovery"), so passing it to a `git` scan is
      # "unknown long flag '--object-discovery'". It has been in this file inert, behind an
      # error that fired earlier.
      #
      # Lob is excluded because its detector matches this repo's pytest function names. A Lob key
      # is `test_` or `live_` followed by alphanumerics, which is also the shape of every test in
      # tests/, and its verifier confirms them because it cannot tell a malformed key from an
      # unauthorized one. The first run that actually scanned reported 41 of these, every one a
      # function name. There is no Lob integration here. Scoped to the one detector rather than
      # excluding tests/ by path, because fixtures are where a real credential is most likely to
      # land by accident.
      - name: TruffleHog (full history)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          # Pinning the action by SHA does NOT pin the scanner. The action's `version` input
          # defaults to "latest" and it runs `ghcr.io/trufflesecurity/trufflehog:${VERSION}`,
          # so with this input unset every run pulls whatever image is newest and the v3.97.1
          # comment above describes only the wrapper. That makes this gate non-reproducible in
          # the direction that matters: its detector set, and therefore what counts as a
          # finding, can change with no commit here. It is not hypothetical — the same action
          # in id-churn-sentinel went red on 2026-08-09 with nothing changed on our side,
          # because upstream shipped 3.96.0 and the next scheduled run picked it up, and 3.96.0
          # is also the release whose Lob detector began matching pytest function names.
          # Pinned to match the action tag above so the two move together and deliberately.
          version: "3.97.1"
          extra_args: --results=verified,unknown --exclude-detectors=Lob
