# Scheduled full-history secret scan (SEC-19). The `security` job in ci.yml already runs
# gitleaks on every push/PR against the *diff*; this complements it with a weekly sweep of the
# *entire* git history using a different engine (verified-credential checking against live
# provider APIs), catching a secret that predates this gate or that gitleaks' ruleset misses.
name: TruffleHog (scheduled full-history scan)

on:
  schedule:
    # Wednesdays at 09:41 UTC. Off-the-hour, and offset from CodeQL's Monday cron.
    - cron: "41 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog (full history, all three result tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history -- this scan's whole point is not being diff-scoped
          persist-credentials: false

      # Two steps, because one `--results` list cannot express what this repository needs.
      #
      # TruffleHog sorts every finding into three tiers, and the names are misleading:
      #
      #   verified    the provider was asked and said YES -- a live credential.
      #   unknown     the provider could not be asked (network error, dead host, DNS failure).
      #   unverified  the provider was asked and said NO -- i.e. a REVOKED credential.
      #
      # `unverified` is the tier that matters most for a history scan. Revocation is the normal
      # end state of a real leak: a key is committed, someone notices, the key is rotated, and
      # the commit stays in history forever. A configuration that omits `unverified` therefore
      # cannot fail on the exact incident a full-history sweep exists to find. Measured on this
      # repository's own history with a real-shaped AWS key pair planted in one commit and
      # deleted in the next:
      #
      #   --results=verified,unknown                     exit 0, planted key not reported
      #   --results=verified,unknown,unverified          exit 183, AWS finding reported
      #
      # `--exclude-detectors` scopes the noise by detector rather than by path, because a path
      # exclusion turns off scanning where a real credential is most likely to land by accident:
      # tests/ and fixtures.
      #
      # Lob is excluded from both steps. Its detector matches this repository's pytest function
      # names -- a Lob key is `test_` or `live_` followed by alphanumerics, which is the shape of
      # every test in tests/ -- and its verifier confirms them because it cannot tell a malformed
      # key from an unauthorized one. The first run that actually scanned reported 41 of these,
      # every one a function name. There is no Lob integration here.
      #
      # `path` is what makes this a whole-repository scan. Omitting `base`/`head` does NOT fall
      # back to scanning everything: with all three unset the action resolves base and head to
      # the same commit and exits 1 on its own guard, "BASE and HEAD commits are the same.
      # TruffleHog won't scan anything." Every scheduled run for a period failed that way,
      # reporting failure while covering zero commits -- the worst state for a gate: loud and
      # empty.
      #
      # `--fail` and `--no-update` are not passed. The action's baked-in command already includes
      # both, and repeating a flag is a hard CLI error ("flag 'fail' cannot be repeated").
      # `--object-discovery` is not passed either: it was never a flag but a separate sub-command.

      # Step 1 -- every detector except Lob, across all three tiers.
      #
      # URI is excluded here, and only here. `tests/test_openaq.py` deliberately contains
      # `https://user:hunter2@x.example/terms`: it is the fixture for the rule that refuses a
      # credential-bearing source URL and proves the refusal message never echoes the credential
      # back into a published ledger. The URI detector cannot verify an RFC 2606 reserved domain
      # -- DNS fails, so the finding lands in `unknown` -- and the fixture is in history, so it
      # cannot be removed without rewriting history. Step 2 keeps URI at the two tiers where it
      # is decidable, so the pair loses only "URI at the unknown tier", which is precisely and
      # only the class this false positive belongs to.
      - name: TruffleHog (all tiers, URI deferred to step 2)
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          path: ./
          # Pinning the action by SHA does NOT pin the scanner. The action's `version` input
          # defaults to "latest" and it runs `ghcr.io/trufflesecurity/trufflehog:${VERSION}`,
          # so with this input unset every run pulls whatever image is newest and the v3.97.1
          # comment above describes only the wrapper. That makes this gate non-reproducible in
          # the direction that matters: its detector set, and therefore what counts as a
          # finding, can change with no commit here. It is not hypothetical -- the same action
          # in id-churn-sentinel went red on 2026-08-09 with nothing changed on our side,
          # because upstream shipped 3.96.0 and the next scheduled run picked it up, and 3.96.0
          # is also the release whose Lob detector began matching pytest function names.
          # Pinned to match the action tag above so the two move together and deliberately.
          version: "3.97.1"
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob,URI

      # Step 2 -- URI restored, at the tiers where the answer is a decision rather than an error.
      # A live credential in a connection string is `verified`; a revoked one is `unverified`.
      # Both still fail the build here. `!cancelled()` so this runs even when step 1 has already
      # failed: a job that stops at the first finding hides the second.
      - name: TruffleHog (URI, at the tiers where it is decidable)
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          path: ./
          version: "3.97.1"
          extra_args: --results=verified,unverified --exclude-detectors=Lob
