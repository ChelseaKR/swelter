# Static analysis for the Python codebase via CodeQL. Runs on every push and
# pull request, plus a weekly scheduled scan to catch advisories published
# after a quiet period with no commits.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:17 UTC. Off-the-hour to avoid the scheduler rush.
    - cron: "17 6 * * 1"

# Default to no access; the one job below elevates only what it needs (CICD-04).
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so CodeQL can upload its findings to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `python` covers src/tests/scripts; `actions` covers the workflow YAML itself
        # (injection, missing pinning, excessive permissions — CICD-20).
        language: [python, actions]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
