# Static analysis for the Python codebase via CodeQL. Runs on every pull
# request, plus a weekly scheduled scan to catch advisories published
# after a quiet period with no commits.
name: CodeQL

on:
  # No push: trigger. CI-CD-STANDARD.md 11e — the pull_request run below
  # already analysed this exact commit, so re-running CodeQL on the merge
  # to main pays for the same analysis twice. The weekly schedule keeps the
  # default-branch alert baseline fresh when no PR has landed.
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:17 UTC. Off-the-hour to avoid the scheduler rush.
    - cron: "17 6 * * 1"

# Default to no access; the one job below elevates only what it needs (CICD-04).
permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref. The key carries the event as
# well as the ref, because a bare `${{ github.ref }}` on a busy `main` makes consecutive pushes
# supersede each other: the older commit's run is cancelled before a job is dispatched, so that
# commit never gets a verdict and the branch looks green on the strength of a run that never
# happened. Pull-request runs share one slot per ref and do supersede each other, which is the
# saving this is for; every push keeps its own slot, keyed by the commit it is a verdict about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required so CodeQL can upload its findings to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `python` covers src/tests/scripts; `actions` covers the workflow YAML itself
        # (injection, missing pinning, excessive permissions — CICD-20).
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
