# Component jobs call the same Make targets aggregated by `make verify`, keeping local and hosted
# enforcement aligned while preserving the stable status-check names required by repository rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref. The key carries the event as
# well as the ref, because a bare `${{ github.ref }}` on a busy `main` makes consecutive pushes
# supersede each other: the older commit's run is cancelled before a job is dispatched, so that
# commit never gets a verdict and the branch looks green on the strength of a run that never
# happened. Pull-request runs share one slot per ref and do supersede each other, which is the
# saving this is for; every push keeps its own slot, keyed by the commit it is a verdict about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked Python environment
        run: uv sync --locked

      - name: Python, documentation, and policy gates
        run: make verify-core

      - name: Authenticate the standards pin against canonical upstream
        env:
          # STANDARDS_PIN_TOKEN is a read-only PAT with access to the private
          # ChelseaKR/portfolio-standards repo; the default job token cannot read a
          # separately permissioned repo, so without the secret the canonical authentication
          # cannot run at all (HTTP 404) — that infrastructure gap is tracked in #119
          # and is announced loudly here instead of failing every merge on it. The
          # offline standards-pin gate (byte-integrity of the vendored standards
          # against the committed manifest) remains blocking in verify-core above.
          STANDARDS_PIN_TOKEN: ${{ secrets.STANDARDS_PIN_TOKEN }}
        run: |
          if [ -n "$STANDARDS_PIN_TOKEN" ]; then
            GITHUB_TOKEN="$STANDARDS_PIN_TOKEN" make standards-pin-upstream
          else
            echo "::warning title=standards-pin upstream authentication did not run::STANDARDS_PIN_TOKEN is not configured, so the pin cannot be authenticated against the private canonical repository. Tracked in #119; the offline byte-integrity gate stays blocking."
          fi

      - name: Build package and locally validate CycloneDX evidence
        run: make verify-package

      - name: Synthesize optional infrastructure
        run: make infra-synth

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Python environment
        run: uv sync --locked

      - name: Install checksum-verified OSV-Scanner v2.5.1
        run: |
          mkdir -p "${RUNNER_TEMP}/osv-bin"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/osv-bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  ${RUNNER_TEMP}/osv-bin/osv-scanner" \
            | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/osv-bin/osv-scanner"
          echo "${RUNNER_TEMP}/osv-bin" >> "${GITHUB_PATH}"

      - name: Install checksum-verified gitleaks v8.30.1
        run: |
          mkdir -p "${RUNNER_TEMP}/security-bin"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/security-bin" gitleaks
          chmod 0755 "${RUNNER_TEMP}/security-bin/gitleaks"
          echo "${RUNNER_TEMP}/security-bin" >> "${GITHUB_PATH}"

      # Every gate below runs on every commit, whatever the gates above it did.
      # `if: ${{ !cancelled() }}` lets a step start after an earlier step failed;
      # it does not make failure invisible -- a failed step still fails this job,
      # and each gate reports its own result. Without it, one unfixable advisory
      # in the npm toolchain meant OSV-Scanner failed here and the secret scan,
      # semgrep, and the workflow policy check then never ran at all. That is
      # also what left the SARIF upload below with no file to upload.
      - name: Waiver registry matches the OSV ignore list
        if: ${{ !cancelled() }}
        run: make security-waivers

      - name: pip-audit (locked Python graph, no waiver)
        if: ${{ !cancelled() }}
        run: make security-pip

      - name: OSV-Scanner (all lockfiles)
        if: ${{ !cancelled() }}
        run: make security-osv

      - name: npm audit (HIGH/CRITICAL)
        if: ${{ !cancelled() }}
        run: make security-node

      - name: Full-history secret scan
        if: ${{ !cancelled() }}
        run: make security-secrets

      - name: Semgrep (blocking SAST + SARIF)
        if: ${{ !cancelled() }}
        run: make security-semgrep

      - name: Upload Semgrep SARIF
        if: ${{ always() && hashFiles('dist/security/semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: dist/security/semgrep.sarif
          category: semgrep

      - name: Workflow policy and zizmor
        if: ${{ !cancelled() }}
        run: make security-workflows

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked

      - name: Firmware compile and tests
        run: make firmware-test

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dashboard unit, schema, i18n, and conformance tests
        run: make web-unit

  a11y:
    # This published name is required by the existing repository ruleset; changing it would wedge
    # pull requests until the live governance exception is separately approved.
    name: a11y-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Browser accessibility and performance gates
        run: make web-browser PLAYWRIGHT_INSTALL_ARGS="--with-deps chromium firefox webkit"

      - name: Render the exact hosted performance candidate
        if: ${{ always() }}
        env:
          PERFORMANCE_BASELINE_OUTPUT: performance-baseline.candidate.json
        run: |
          if find web/.lighthouseci -maxdepth 1 -type f -name 'lhr-*.json' -print -quit | grep -q .; then
            npm --prefix web run performance:baseline
          fi

      - name: Retain browser accessibility and performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/.lighthouseci
            web/performance-baseline.candidate.json
          if-no-files-found: warn
          retention-days: 30
