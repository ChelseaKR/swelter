# CI runs `make verify` directly (fmt-check + lint + typecheck + a11y + i18n + test), so drift
# between the Makefile and CI is impossible rather than a matter of manual discipline
# (CICD-27). A wheel/sdist build runs on every push too, not just at release (CQ-10).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The merge gate: exactly `make verify`.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # `--locked` fails if uv.lock is stale, so CI builds the same environment
      # that produced the local green run.
      - name: Install (locked)
        run: uv sync --locked

      - name: make verify (fmt-check, lint, typecheck, a11y, i18n, test)
        run: make verify

      - name: Build sdist + wheel (packaging sanity check, every push)
        run: uv build

  # Supply-chain checks. Separate job so a dependency or secret finding is
  # reported on its own, not tangled with the functional gate.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # Full history so the gitleaks Action can resolve the PR commit range
      # (it diffs <sha>^..<sha>; a shallow clone lacks the parent commit).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Audit the locked dependency set against known advisories. Run from the
      # project's resolved requirements so the audited tree matches what ships.
      - name: Sync (locked)
        run: uv sync --locked

      # Audit the project's runtime environment (PyYAML + the package), not an
      # isolated tool env. `--no-dev` keeps dev-tool noise out of the gate.
      # Retry to ride out transient advisory-DB fetch failures rather than
      # silencing the gate; a real finding still fails the build.
      - name: pip-audit (known-vulnerability scan)
        run: |
          for a in 1 2 3; do uv run --no-dev --with pip-audit pip-audit && exit 0; sleep 10; done
          uv run --no-dev --with pip-audit pip-audit

      # Secret scan. A repository scan needs a (free) GitLeaks license for the
      # Action; any finding is now merge-blocking.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST beyond CodeQL: OWASP-style Python rules + secrets/injection patterns (SEC-07).
      # No SEMGREP_APP_TOKEN is configured, so this runs the open default+python rule packs
      # locally rather than Semgrep's hosted policy/Supply Chain features. Any finding at
      # Semgrep's default blocking severity fails the build (no `|| true`, no continue-on-error).
      # Version pinned so a new Semgrep release can't silently redden the gate with new rules;
      # bump deliberately via Dependabot/Renovate or a reviewed PR, same discipline as pre-commit.
      - name: Semgrep (SAST)
        run: uv run --no-dev --with semgrep==1.168.0 semgrep ci --config=p/default --config=p/python

      # Workflow-file SAST: injection via untrusted expressions, missing permissions/pinning,
      # cache-poisoning-prone patterns (CICD-19/CICD-20's actions half, guards CICD-04/CICD-24).
      # Version pinned for the same reason as Semgrep above.
      - name: zizmor (GitHub Actions workflow audit)
        run: uvx zizmor@1.16.3 --min-severity=high .github/workflows

  # Node firmware is checked in alongside the Python code. Syntax-compile the
  # MicroPython sources so a broken node build is caught in CI, then run the
  # hardware-free firmware tests (store-and-forward buffering, bounded
  # retry/backoff, sampler fault-tolerance) on desktop CPython. The firmware is
  # not the installed package, so it needs only pytest, no project deps.
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Byte-compile firmware sources
        run: python -m compileall firmware/src

      - name: Firmware tests (hardware-free, CPython)
        run: |
          python -m pip install --quiet pytest
          python -m pytest firmware/tests -q

  # Advisory only: a real-browser axe pass over the built dashboard. The
  # structural gate in `checks` is the blocking one; this adds depth without
  # gating the merge, so it is allowed to fail.
  a11y-advisory:
    name: a11y-advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: pa11y (axe runner, WCAG2AA)
        # Chromium has no usable sandbox on the GitHub runner, so launch with --no-sandbox.
        run: |
          echo '{"chromeLaunchConfig":{"args":["--no-sandbox","--disable-setuid-sandbox"]}}' > .pa11y.json
          npx --yes pa11y@8 --config .pa11y.json --standard WCAG2AA --runner axe ./web/index.html
