# CI runs `make verify` directly (fmt-check + lint + typecheck + a11y + i18n + test), so drift
# between the Makefile and CI is impossible rather than a matter of manual discipline
# (CICD-27). A wheel/sdist build runs on every push too, not just at release (CQ-10).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The merge gate: exactly `make verify`.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # `--locked` fails if uv.lock is stale, so CI builds the same environment
      # that produced the local green run.
      - name: Install (locked)
        run: uv sync --locked

      - name: make verify (fmt-check, lint, typecheck, a11y, i18n, test)
        run: make verify

      - name: Build sdist + wheel (packaging sanity check, every push)
        run: uv build

  # Supply-chain checks. Separate job so a dependency or secret finding is
  # reported on its own, not tangled with the functional gate.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # Full history so the gitleaks Action can resolve the PR commit range
      # (it diffs <sha>^..<sha>; a shallow clone lacks the parent commit).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # Audit the locked dependency set against known advisories. Run from the
      # project's resolved requirements so the audited tree matches what ships.
      - name: Sync (locked)
        run: uv sync --locked

      # Audit the project's runtime environment (PyYAML + the package), not an
      # isolated tool env. `--no-dev` keeps dev-tool noise out of the gate.
      # Retry to ride out transient advisory-DB fetch failures rather than
      # silencing the gate; a real finding still fails the build.
      #
      # PYSEC-2026-597 (CVE-2026-12243, nltk path traversal in nltk.data.load())
      # is waived: nltk is a transitive dev-only dependency of textstat (the
      # reading-level lint gate), never imported by this package's own code
      # (verified: zero `import nltk`/`nltk.` references outside .venv), and
      # textstat only ever loads its own bundled resources -- never an
      # attacker-controlled path. No fixed nltk release exists yet (the
      # advisory affects every published version). Revisit when upstream ships
      # a fix.
      - name: pip-audit (known-vulnerability scan)
        run: |
          for a in 1 2 3; do uv run --no-dev --with pip-audit pip-audit --ignore-vuln PYSEC-2026-597 && exit 0; sleep 10; done
          uv run --no-dev --with pip-audit pip-audit --ignore-vuln PYSEC-2026-597

      # Secret scan. A repository scan needs a (free) GitLeaks license for the
      # Action; any finding is now merge-blocking.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST beyond CodeQL: OWASP-style Python rules + secrets/injection patterns (SEC-07).
      # No SEMGREP_APP_TOKEN is configured, so this runs the open default+python rule packs
      # locally rather than Semgrep's hosted policy/Supply Chain features. This step has no
      # error-suppressing shell fallback and no continue-on-error, so any finding at Semgrep's
      # default blocking severity fails the build for real.
      # Version pinned so a new Semgrep release can't silently redden the gate with new rules;
      # bump deliberately via Dependabot/Renovate or a reviewed PR, same discipline as pre-commit.
      - name: Semgrep (SAST)
        run: uv run --no-dev --with semgrep==1.168.0 semgrep ci --config=p/default --config=p/python

      # Workflow-file SAST: injection via untrusted expressions, missing permissions/pinning,
      # cache-poisoning-prone patterns (CICD-19/CICD-20's actions half, guards CICD-04/CICD-24).
      # Version pinned for the same reason as Semgrep above.
      - name: zizmor (GitHub Actions workflow audit)
        run: uvx zizmor@1.16.3 --min-severity=high .github/workflows

  # Node firmware is checked in alongside the Python code. Syntax-compile the
  # MicroPython sources so a broken node build is caught in CI, then run the
  # hardware-free firmware tests (store-and-forward buffering, bounded
  # retry/backoff, sampler fault-tolerance) on desktop CPython. The firmware is
  # not the installed package, so it needs only pytest, no project deps.
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Byte-compile firmware sources
        run: python -m compileall firmware/src

      - name: Firmware tests (hardware-free, CPython)
        run: |
          python -m pip install --quiet pytest
          python -m pytest firmware/tests -q

  # web/app.js's pure, function-scoped dashboard logic under `node --test`, plus the JSON-schema
  # contract (`schemas/*.schema.json`) validated from the JS side — the counterpart to
  # `tests/test_schema_contract.py` on the Python side (FIX-07). Merge-blocking: web/ has zero
  # runtime dependencies, but its dev-only Node toolchain is real test infrastructure, not
  # advisory. `npm ci` installs the exact locked tree from the committed package-lock.json.
  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # `node --test` only expands glob arguments from Node 21 on; the test
          # script passes "tests/**/*.test.js", so Node 20 fails "could not find".
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        working-directory: web
        run: npm ci

      - name: node --test (app.js unit tests + JS-side schema contract)
        working-directory: web
        run: npm test

  # A real-browser axe pass over the built dashboard (page load, WCAG2AA). Promoted from advisory
  # to merge-blocking (FIX-07) now that the structural gate in `checks` (make a11y) has this
  # dynamic counterpart backing it up too; pa11y is pinned to an exact release, same discipline as
  # the other pinned scanners in `security` below.
  a11y:
    # Still published under the name the branch-protection ruleset requires ("a11y-advisory").
    # The job itself is merge-blocking (FIX-07): the ruleset requires it to pass, and it no
    # longer swallows failures. Renaming it needs a ruleset edit first, or every PR wedges on
    # an "expected" check that never reports.
    name: a11y-advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: pa11y (axe runner, WCAG2AA)
        # Chromium has no usable sandbox on the GitHub runner, so launch with --no-sandbox.
        run: |
          echo '{"chromeLaunchConfig":{"args":["--no-sandbox","--disable-setuid-sandbox"]}}' > .pa11y.json
          npx --yes pa11y@8.0.0 --config .pa11y.json --standard WCAG2AA --runner axe ./web/index.html
