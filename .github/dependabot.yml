# Weekly dependency updates. "pip" covers the uv project (pyproject + uv.lock);
# "github-actions" keeps the workflow action pins current.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    # Wait a week after a version publishes before proposing it -- a newly published release
    # (malicious or just unstable) doesn't land here on day one. renovate.json applies the same
    # 72h floor via `minimumReleaseAge`; this is dependabot's equivalent.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "javascript"
    cooldown:
      default-days: 7
