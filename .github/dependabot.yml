# Weekly dependency updates. "uv" covers the uv project (pyproject + uv.lock, updated together --
# see #167, where "pip" left uv.lock stale and every Python bump was born red against
# `uv sync --locked`); "github-actions" keeps the workflow action pins current.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    # Wait a week after a version publishes before proposing it -- a newly published release
    # (malicious or just unstable) doesn't land here on day one. renovate.json applies the same
    # 72h floor via `minimumReleaseAge`; this is dependabot's equivalent.
    cooldown:
      default-days: 7
    # If a future uv.lock format (schema `version`/`revision` in the lockfile header) outruns what
    # Dependabot's uv ecosystem parses, its update PR will say so directly rather than this comment
    # making a claim the next reader has to disprove from a red CI run -- watch the PR body, not
    # this file, for that failure mode.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "javascript"
    cooldown:
      default-days: 7
