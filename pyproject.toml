[project]
name = "swelter"
version = "0.1.0"
description = "Self-hostable community heat and air-quality sensing network with calibrated, open, accessible data — copy network.yaml to register your own"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Chelsea Kelly-Reif" }]
requires-python = ">=3.12"
keywords = [
    "air-quality",
    "urban-heat",
    "environmental-justice",
    "sensor-network",
    "open-data",
    "sensorthings",
    "calibration",
    "civic-tech",
    "self-hosted",
    "community-owned",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Two small runtime dependencies by design: YAML for committed operator config and the portfolio's
# canonical structlog JSON renderer for opt-in Tier-C diagnostics. Everything else is stdlib.
dependencies = [
    "pyyaml>=6.0",
    "structlog==26.1.0",
]

[project.urls]
Homepage = "https://chelseakr.github.io/swelter/"
Documentation = "https://github.com/ChelseaKR/swelter#project-documentation"
Source = "https://github.com/ChelseaKR/swelter"
Issues = "https://github.com/ChelseaKR/swelter/issues"

[project.scripts]
swelter = "swelter.cli:main"

[dependency-groups]
dev = [
    "babel==2.18.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "types-PyYAML",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]
infra = [
    "aws-cdk-lib==2.264.0",
    "constructs==10.7.1",
]
mutation = [
    "mutmut==3.6.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swelter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "infra/cdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
incremental = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "signing"          # firmware/src/signing.py, imported via sys.path in tests
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"

[tool.mutmut]
source_paths = ["src/swelter/"]
only_mutate = [
    "src/swelter/calibrate.py",
    "src/swelter/models.py",
    "src/swelter/qc.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_calibrate.py",
    "tests/test_calibrate_branches.py",
    "tests/test_models.py",
    "tests/test_qc.py",
]
max_stack_depth = 8

[tool.coverage.run]
branch = true
source = ["swelter"]
# `python -m swelter` and the `swelter` console script are exercised in real use;
# the 4-line module-execution entrypoint is not worth a coverage-instrumented
# subprocess, so it is omitted rather than padded with a trivial test.
omit = ["src/swelter/__main__.py"]

[tool.coverage.report]
show_missing = true
# Lines that are structurally unreachable under test: the `__main__` guard and
# Protocol method stubs (`...` bodies in store.Store) carry no behavior to assert.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "^\\s*\\.\\.\\.\\s*$",
]
