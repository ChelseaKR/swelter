[project]
name = "swelter"
version = "0.1.0"
description = "Community heat and air-quality sensing network with calibrated, open, accessible data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Chelsea Kelly-Reif" }]
requires-python = ">=3.11"
keywords = [
    "air-quality",
    "urban-heat",
    "environmental-justice",
    "sensor-network",
    "open-data",
    "sensorthings",
    "calibration",
    "civic-tech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# One runtime dependency, by design: config is committed YAML and nothing else
# needs a wheel. Everything below is the Python standard library. Keeping the
# dependency surface this small is what makes swelter portable to a
# Raspberry-Pi-class host, cheap to run, and durable across lean years.
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ChelseaKR/swelter"
Source = "https://github.com/ChelseaKR/swelter"
Issues = "https://github.com/ChelseaKR/swelter/issues"

[project.scripts]
swelter = "swelter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swelter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
