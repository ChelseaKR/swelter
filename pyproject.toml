[project]
name = "swelter"
version = "0.1.0"
description = "Self-hostable community heat and air-quality sensing network with calibrated, open, accessible data — copy network.yaml to register your own"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Chelsea Kelly-Reif" }]
requires-python = ">=3.12"
keywords = [
    "air-quality",
    "urban-heat",
    "environmental-justice",
    "sensor-network",
    "open-data",
    "sensorthings",
    "calibration",
    "civic-tech",
    "self-hosted",
    "community-owned",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# One runtime dependency, by design: config is committed YAML and nothing else
# needs a wheel. Everything below is the Python standard library. Keeping the
# dependency surface this small is what makes swelter portable to a
# Raspberry-Pi-class host, cheap to run, and durable across lean years.
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ChelseaKR/swelter"
Source = "https://github.com/ChelseaKR/swelter"
Issues = "https://github.com/ChelseaKR/swelter/issues"

[project.scripts]
swelter = "swelter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "types-PyYAML",
    "textstat>=0.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swelter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "signing"          # firmware/src/signing.py, imported via sys.path in tests
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["swelter"]
# `python -m swelter` and the `swelter` console script are exercised in real use;
# the 4-line module-execution entrypoint is not worth a coverage-instrumented
# subprocess, so it is omitted rather than padded with a trivial test.
omit = ["src/swelter/__main__.py"]

[tool.coverage.report]
show_missing = true
# Lines that are structurally unreachable under test: the `__main__` guard and
# Protocol method stubs (`...` bodies in store.Store) carry no behavior to assert.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "^\\s*\\.\\.\\.\\s*$",
]
